<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>flip_clock</title>
    <style>
        body {
            margin: 0;
            background-color: black;
            color: white;
            font-family: monospace, monospace;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 5rem;
        }
    </style>
</head>
<body>
<div id="root"></div>
<script>
    function updateTime() {
        const now = new Date();
        const hh = String(now.getHours()).padStart(2, '0');
        const mm = String(now.getMinutes()).padStart(2, '0');
        document.getElementById('root').textContent = `${hh}:${mm}`;
    }
    updateTime();
    setInterval(updateTime,  1000); // 1분마다 갱신
</script>
</body>
</html>
